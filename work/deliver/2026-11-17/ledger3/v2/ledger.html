  --bg:#14181c;--panel:#1c2228;--ink:#e6e9ec;--mute:#9aa4ad;--line:#2f3841;--soft:#232a31;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",Arial,"Noto Sans Hebrew",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.card span{color:var(--mute);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
select,input[type=search]{font:inherit;font-size:14px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
input[type=search]{flex:1;min-width:160px}
.count{color:var(--mute);font-size:13px;margin-inline-start:auto}
h2{font-size:17px;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}
h2 small{color:var(--mute);font-weight:400;font-size:13px}
.it{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.it.chk{opacity:.55}
.it input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--acc)}
.hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.id{font-weight:700;font-variant-numeric:tabular-nums}
.b{padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-נעשה{color:var(--done);background:var(--done-bg)}.s-חלקי{color:var(--part);background:var(--part-bg)}.s-לא{color:var(--no);background:var(--no-bg)}.s-לא\ נבדק{color:var(--unk);background:var(--unk-bg)}
.t-today{color:var(--today);background:var(--today-bg)}.t-g2{color:var(--g2);background:var(--g2-bg)}.t-wait{color:var(--wait);background:var(--wait-bg)}.t-done{color:var(--done);background:var(--done-bg)}
.date{color:var(--mute)}
.req{grid-column:2;margin:2px 0;font-size:15px}
.fd{grid-column:2;font-size:13.5px;color:var(--ink);background:var(--soft);border-radius:8px;padding:5px 8px}
.fd::before{content:"מצאתי: ";font-weight:700}
.src{grid-column:2;font-size:12px;color:var(--mute)}
.nt{grid-column:2;font-size:12.5px;color:var(--part)}
.b.old{color:var(--mute);background:var(--soft)}
details.old{grid-column:2;font-size:12.5px;color:var(--mute)}details.old summary{cursor:pointer}
.rv{grid-column:2;font-size:12px;color:var(--mute);font-style:italic}
.empty{color:var(--mute);padding:30px 0;text-align:center}
footer{margin-top:30px;color:var(--mute);font-size:12px}
@media (max-width:560px){.wrap{padding:14px 16px 50px}h1{font-size:20px}.card b{font-size:20px}}
</style>
</head>

  for(const x of g){h+='<div class="it'+(checks[x.id]?' chk':'')+'"><input type="checkbox" data-id="'+x.id+'" aria-label="סימון '+x.id+'"'+(checks[x.id]?' checked':'')+'>'+
   '<div class="hd"><span class="id">'+x.id+'</span><span class="b s-'+esc(x.state)+'">'+esc(x.state)+'</span><span class="b '+tCls(x.today)+'">'+esc(x.today)+'</span>'+
   (x.agent!=='—'&&!x.agent.startsWith('לא מכוסה')&&x.agent!=='ממתין לבעלים'?'<span class="b t-today">'+esc(x.agent)+'</span>':'')+(x.state298&&x.state298!==x.state?'<span class="b old">ב-S7F298: '+esc(x.state298)+'</span>':'')+'<span class="date">'+esc(x.date)+'</span></div>'+
   '<div class="req">'+esc(x.req)+'</div>'+(x.found&&x.found!=='—'?'<div class="fd">'+esc(x.found)+'</div>':'')+
   (x.note?'<div class="nt">'+esc(x.note)+'</div>':'')+(x.found298&&x.found298!=='—'&&x.found298!==x.found?'<details class="old"><summary>מה נמצא ב-S7F298</summary>'+esc(x.found298)+'</details>':'')+(x.rev2?'<div class="rv">'+esc(x.rev2)+'</div>':'')+'<div class="src">'+esc(x.src.join(' · '))+'</div></div>'}}
 $('list').innerHTML=h}
$('list').onchange=e=>{const c=e.target;if(!c.dataset||!c.dataset.id)return;if(c.checked)checks[c.dataset.id]=1;else delete checks[c.dataset.id];saveChecks();render()};
$('foot').innerHTML='המקורות: '+D.sources.map(esc).join(' · ')+'<br>מצב: '+Object.entries(D.states_legend).map(([k,v])=>esc(k)+' — '+esc(v)).join(' · ')+'<br>הסימונים נשמרים רק בדפדפן הזה.';
render();
</script>
</body>
</html>
