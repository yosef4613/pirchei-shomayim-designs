name: Verify channel media
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/channel-media.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download original covers from the verified channel videos
        shell: python
        run: |
          import json, pathlib, urllib.request, time
          ids = ["-4sE-rfQI1k", "rWHE6woblu4", "aFhQjhm1if8", "yjBQLelJDKw", "sAeFaXlxv0E", "n6tLDS_ioYk", "s_CNJzzsA8g", "_eX_k4H5WHo"]
          directory = pathlib.Path("channel-media")
          directory.mkdir()
          manifest = []
          for video in ids:
              url = f"https://i.ytimg.com/vi/{video}/hqdefault.jpg"
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(request, timeout=25) as response:
                          content = response.read()
                      if len(content) < 4000 or not content.startswith(bytes.fromhex("ffd8")):
                          raise ValueError(f"Invalid cover for {video}")
                      (directory / f"{video}.jpg").write_bytes(content)
                      manifest.append({"id": video, "source": url, "video": f"https://www.youtube.com/watch?v={video}", "channel": "UCNBe0QyCp3F_w21GROAjkxQ"})
                      print(f"Downloaded {video}: {len(content)} bytes")
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2)
          (directory / "sources.json").write_text(json.dumps(manifest, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: verified-channel-covers
          path: channel-media
          retention-days: 3
          if-no-files-found: error
