function drawSculpture(time,force=false){if(!ctx||(!force&&(active!=='aurora'||!sculptureVisible||document.hidden||reduceMotion)))return;if(!force&&time-lastFrame<33)return;lastFrame=time;if(!reduceMotion)phase=time*.00018;let t=phase,w=cw,h=ch,cx=w*.5+pointer.x*9,cy=h*.49+pointer.y*9,r=Math.min(w,h)*.34;ctx.clearRect(0,0,w,h);let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.5);glow.addColorStop(0,'#647a9f19');glow.addColorStop(.5,'#6c5da413');glow.addColorStop(1,'#5a7b9900');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(cx,cy);ctx.rotate(-.29+Math.sin(t*.6)*.07);const count=37,segments=105;for(let j=0;j<count;j++){let q=j/(count-1),latitude=(q-.5)*Math.PI*.95,base=Math.cos(latitude),y0=Math.sin(latitude)*r;ctx.beginPath();for(let i=0;i<=segments;i++){let a=i/segments*Math.PI*2,warp=1+.11*Math.sin(a*3+t*2+q*6)+.045*Math.sin(a*6-t),x=Math.cos(a)*r*base*warp,y=y0+Math.sin(a)*r*.23*base*warp+Math.sin(a*2+t*2+q*5)*r*.095;let px=x*(.95+.05*Math.sin(a)),py=y; i?ctx.lineTo(px,py):ctx.moveTo(px,py)}let g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,`rgba(177,154,254,${.24+q*.35})`);g.addColorStop(.45,`rgba(151,200,241,${.22+q*.4})`);g.addColorStop(1,`rgba(123,239,211,${.2+q*.4})`);ctx.strokeStyle=g;ctx.lineWidth=j%5===0?1.15:.65;ctx.stroke()}ctx.restore();for(let i=0;i<24;i++){let a=i*2.399+t*.12,rr=r*(1.12+(i%5)*.07),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.85;ctx.fillStyle=`rgba(170,209,235,${.15+(i%4)*.1})`;ctx.beginPath();ctx.arc(x,y,i%6===0?1.7:.8,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.strokeStyle='#b0ccf126';ctx.lineWidth=.6;ctx.ellipse(cx,cy,r*1.3,r*.37,-.46,0,Math.PI*2);ctx.stroke()}

if('IntersectionObserver' in window){new IntersectionObserver(entries=>{sculptureVisible=entries[0].isIntersecting;if(sculptureVisible){resizeSculpture();drawSculpture(performance.now(),true)}},{threshold:.05}).observe(canvas)}else{sculptureVisible=true}
canvas.parentElement.addEventListener('pointermove',e=>{if(!matchMedia('(pointer:fine)').matches||reduceMotion)return;let r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width-.5;pointer.y=(e.clientY-r.top)/r.height-.5});canvas.parentElement.addEventListener('pointerleave',()=>{pointer={x:0,y:0}});addEventListener('resize',()=>{resizeSculpture();drawSculpture(performance.now(),true)},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden)drawSculpture(performance.now(),true)});
try{let saved=localStorage.getItem('ps-motion');if(saved!==null)reduceMotion=motionPreference.matches||saved==='true'}catch{}setMotion(reduceMotion);let hash=location.hash.match(/^#design-(premiere|noir|aurora)$/);if(hash)choose(hash[1]);else choose('noir');resizeSculpture();requestAnimationFrame(loop);updateScroll();
</script>
