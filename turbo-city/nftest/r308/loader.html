<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>טורבו סיטי</title>
<style>:root{color-scheme:dark;--bg:#081018;--ink:#f3f7fa}:root:not([data-theme="light"]){--bg:#081018}:root[data-theme="dark"]{--bg:#081018}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px "Segoe UI","Noto Sans Hebrew",Arial,sans-serif}#ld{display:grid;place-items:center;height:100%;padding:0 16px;text-align:center}</style></head>
<body><div id="ld">טוען את טורבו סיטי…</div>
<script>
(async()=>{try{
 const parts=await Promise.all(['g1.txt', 'g2.txt', 'g3.txt', 'g4.txt', 'g5.txt', 'g6.txt', 'g7.txt', 'g8.txt', 'g9.txt', 'g10.txt', 'g11.txt', 'g12.txt', 'g13.txt', 'g14.txt', 'g15.txt', 'g16.txt', 'g17.txt', 'g18.txt', 'g19.txt', 'g20.txt', 'g21.txt', 'g22.txt', 'g23.txt', 'g24.txt', 'g25.txt'].map(u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})));
 document.open();document.write(parts.join(''));document.close();
}catch(e){document.getElementById('ld').textContent='הטעינה נכשלה: '+e.message}})();
</script></body></html>
