<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת סינון</title>
<style>body{font:15px Arial,sans-serif;margin:16px;background:#fff;color:#111}td{padding:3px 8px;border-bottom:1px solid #ddd}.ok{color:#176b2c}.bad{color:#b3261e;font-weight:700}</style></head><body>
<h1>בדיקת סינון — S7F301 (בלי הערות, נתונים בלי תנועות) — 20 החלקים של הבנייה</h1><p id="s">בודק…</p><table id="t"></table><p>אם הכול עבר — המשחק עצמו: <a href="r301/loader.html">r301/loader.html</a></p>
<script>const F=["r301/g1.txt", "r301/g2.txt", "r301/g3.txt", "r301/g4.txt", "r301/g5.txt", "r301/g6.txt", "r301/g7.txt", "r301/g8.txt", "r301/g9.txt", "r301/g10.txt", "r301/g11.txt", "r301/g12.txt", "r301/g13.txt", "r301/g14.txt", "r301/g15.txt", "r301/g16.txt", "r301/g17.txt", "r301/g18.txt", "r301/g19.txt", "r301/g20.txt"];const t=document.getElementById('t');let bad=[];
(async()=>{for(const f of F){const tr=document.createElement('tr');let r;try{const x=await fetch(f+'?v=6',{cache:'no-store'});r=x.status;}catch(e){r='שגיאה'}
const ok=r===200;if(!ok)bad.push(f);tr.innerHTML='<td>'+f.replace('.txt','')+'</td><td class="'+(ok?'ok':'bad')+'">'+(ok?'עבר':'נחסם ('+r+')')+'</td>';t.appendChild(tr)}
document.getElementById('s').textContent=bad.length?('נחסמו '+bad.length+': '+bad.map(x=>x.replace('.txt','')).join(', ')):'הכול עבר';})();</script></body></html>
