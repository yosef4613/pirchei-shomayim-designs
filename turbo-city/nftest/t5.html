<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת סינון</title>
<style>body{font:15px Arial,sans-serif;margin:16px;background:#fff;color:#111}td{padding:3px 8px;border-bottom:1px solid #ddd}.ok{color:#176b2c}.bad{color:#b3261e;font-weight:700}</style></head><body>
<h1>בדיקת סינון — S7F300, ‏חיתוך של החלקים שנחסמו</h1><p id="s">בודק…</p><table id="t"></table>
<script>const F=["q/g6_1.txt", "q/g6_2.txt", "q/g6_3.txt", "q/g6_4.txt", "q/g6_5.txt", "q/g6_6.txt", "q/g6_7.txt", "q/g6_8.txt", "q/g8_1.txt", "q/g8_2.txt", "q/g8_3.txt", "q/g8_4.txt", "q/g8_5.txt", "q/g8_6.txt", "q/g8_7.txt", "q/g8_8.txt", "q/g10_1.txt", "q/g10_2.txt", "q/g10_3.txt", "q/g10_4.txt", "q/g10_5.txt", "q/g10_6.txt", "q/g10_7.txt", "q/g10_8.txt", "q/g18_1.txt", "q/g18_2.txt", "q/g18_3.txt", "q/g18_4.txt", "q/g20_1.txt", "q/g20_2.txt", "q/g20_3.txt", "q/g20_4.txt"];const t=document.getElementById('t');let bad=[];
(async()=>{for(const f of F){const tr=document.createElement('tr');let r;try{const x=await fetch(f+'?v=5',{cache:'no-store'});r=x.status;}catch(e){r='שגיאה'}
const ok=r===200;if(!ok)bad.push(f);tr.innerHTML='<td>'+f.replace('.txt','')+'</td><td class="'+(ok?'ok':'bad')+'">'+(ok?'עבר':'נחסם ('+r+')')+'</td>';t.appendChild(tr)}
document.getElementById('s').textContent=bad.length?('נחסמו '+bad.length+': '+bad.map(x=>x.replace('.txt','')).join(', ')):'הכול עבר';})();</script></body></html>
